<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Crack the Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, rgba(15, 81, 50, 0.85), rgba(17, 24, 39, 0.9)), url("{{ url_for('static', filename='forest_trail.jpg') }}");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
        }
        .btn-primary-custom {
            background-color: #0f5132;
            border-color: #0f5132;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
        }
        .btn-primary-custom:hover {
            background-color: #0b3d26;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="auth-card mx-auto">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="Crack the Trek Logo" style="height: 50px;" class="mb-2">
                        <div class="h3 text-success fw-bold">Crack the Trek</div>
                        <p class="text-muted small">Create your account today.</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show small mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="fullname" name="Fullname" placeholder="John Doe" required maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="Email" placeholder="john@example.com" required maxlength="100">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" name="Password" placeholder="••••••••" required minlength="6" maxlength="30">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="password2" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" class="form-control" id="password2" name="Password2" placeholder="••••••••" required minlength="6" maxlength="30">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="contact" class="form-label fw-semibold">Contact Number</label>
                                <input type="tel" class="form-control" id="contact" name="Contact" placeholder="+91 9876543210" required maxlength="15">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="role" class="form-label fw-semibold">Register As</label>
                                <select class="form-select" id="role" name="Role" required>
                                    <option value="Trekker" selected>Trekker (Participant)</option>
                                    <option value="Staff">Staff (Guide / Leader)</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                            <i class="bi bi-person-plus me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">Already registered?</span>
                        <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none text-success ms-1">Sign In Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
