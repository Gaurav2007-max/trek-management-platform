<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <div> 
        {% with messages=get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for message in messages %}
        {{message}}
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="/register" method="POST">
            <label for="fullname">Fullname:</label>
            <input type="text" id="fullname" name="Fullname" required minlength="1" maxlength="50" pattern="[A-Za-z]">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="Email" required maxlength="100">
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="Password" required minlength="6" maxlength="30">
            <br><br>
            <label for="password2">Confirm Password:</label>
            <input type="password" id="password2" name="Password2" required minlength="6" maxlength="30">
            <br><br>
            <label for="contact">Contact:</label>
            <input type="text" id="contact" name="Contact" required pattern="[0-9]{10}">
            <br><br>
            I am a <label for="role"></label>
            <select name="Role" id="role" >
                <option value="" disabled selected hidden>Select Role</option>
                <option value="Staff">Trek Staff</option>
                <option value="Trekker">Trekker</option>
            </select>
            <div><input type="submit" value="submit"></div>
        </form>
        <br><br>
        <div><a href="/">Already Registered? Login Here</a></div>
    </div>
</body>
</html>
