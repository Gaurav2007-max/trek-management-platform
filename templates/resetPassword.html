<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Crack the Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <main class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 440px;">
        <h1 class="h4 text-success fw-bold mb-2">Set a new password</h1>
        <p class="text-muted">Enter the 6-digit code sent to your email and choose a new password.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} small">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form action="{{ url_for('resetPassword') }}" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="mb-3">
                <label for="code" class="form-label fw-semibold">Verification code</label>
                <input type="text" id="code" name="Code" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">New password</label>
                <input type="password" id="password" name="Password" class="form-control" minlength="6" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label fw-semibold">Confirm new password</label>
                <input type="password" id="password2" name="Password2" class="form-control" minlength="6" maxlength="100" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Reset password</button>
        </form>
        <a href="{{ url_for('forgotPassword') }}" class="text-center small text-success text-decoration-none mt-3">Request another code</a>
    </main>
</body>
</html>
