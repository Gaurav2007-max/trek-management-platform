<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Crack the Trek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <main class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 440px;">
        <h1 class="h4 text-success fw-bold mb-2">Forgot password?</h1>
        <p class="text-muted">Enter your account email and we will send a password reset code if it is registered.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} small">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form action="{{ url_for('forgotPassword') }}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" id="email" name="Email" class="form-control" maxlength="100" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Send reset code</button>
        </form>
        <a href="{{ url_for('login') }}" class="text-center small text-success text-decoration-none mt-3">Back to sign in</a>
    </main>
</body>
</html>
