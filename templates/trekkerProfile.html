{% extends "trekkerLayout.html" %}
{% block content %}

<div class="card my-5">

    <h5 class="card-title">Name : {{Trekker[1]}}</h5>
    <h6 class="card-subtitle mb-2 text-body-secondary">Trekker ID : {{Trekker[0]}}</h6>

  </div>
  </div>
</div>
{% endblock %}
