{% extends "adminLayout.html" %}
{% block content %}
<form action="/editTrek/{{trek[0]}}" method="POST">
    <label for="TrekName">Trek Name</label>
    <input type="text" name="Trekname" id="TrekName" value="{{trek[1]}}">

    <label for="Difficulty">Difficulty</label>
    <Select id="Difficulty" name="Difficulty">
        <option value="Easy" {% if trek[2]=='Easy' %}selected{% endif %}>Easy</option>
        <option value="Moderate"{% if trek[2]=='Moderate' %}selected{% endif %}>Moderate</option>
        <option value="Hard" {% if trek[2]=='Hard' %}selected{% endif %}>Hard</option>
    </Select>        
    
    <label for="Location">Location</label>
    <input type="text" name="Location" id="Location" value="{{trek[3]}}">

    <label for="Duration">Duration(in hrs)</label>
    <input type="number" name="Duration" id="Duration" value="{{trek[4]}}">

    <label for="Start">Start Date</label>
    <input type="date" name="sDate" id="Start" value="{{trek[5]}}">

    <label for="End">End Date</label>
    <input type="date" name="eDate" id="End" value="{{trek[6]}}">

    <label for="Slot">Slots</label>
    <input type="number" name="Slot" id="Slot" value="{{trek[7]}}">

    <label for="Staff">Staff ID</label>
    <input type="number" name="StaffId" id="Staff" value="{{trek[8]}}">

    <label for="Status">Status</label>
    <input type="text" name="Status" id="Status" value="{{trek[9]}}">
    
    <a href="/adminTreks">Cancel</a>
    <input type="submit" value="Save">

</form>
{% endblock %}
