{% extends "adminLayout.html" %}
{% block title %}Edit Trek - TrekTerrain{% endblock %}

{% block content %}
<br><br>
<div id="form" class="d-flex flex-column justify-content-center align-items-center vh-80" >
<form action="/editTrek/{{trek[0]}}" method="POST" style="width:400px">
    <label for="TrekName">Trek Name</label><small class="form-text text-muted"> (Length should be 3-100)</small><br>
    <input class="form-control" type="text" name="Trekname" id="TrekName" value="{{trek[1]}}" required minlength="3" maxlength="100">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold mb-3 text-primary"><i class="bi bi-pencil-square me-2"></i> Edit Trek Details</h4>
            <form action="{{ url_for('editTrek', TrekId=trek.TrekId) }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Trek Name</label>
                        <input type="text" name="Trekname" class="form-control" value="{{ trek.TrekName }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Difficulty Level</label>
                        <select name="Difficulty" class="form-select" required>
                            <option value="Easy" {% if trek.Difficulty=='Easy' %}selected{% endif %}>Easy</option>
                            <option value="Moderate" {% if trek.Difficulty=='Moderate' %}selected{% endif %}>Moderate</option>
                            <option value="Hard" {% if trek.Difficulty=='Hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>
                </div>

    <label for="Difficulty">Difficulty</label>
    <Select class="form-control" id="Difficulty" name="Difficulty">
        <option value="Easy" {% if trek[2]=='Easy' %}selected{% endif %}>Easy</option>
        <option value="Moderate"{% if trek[2]=='Moderate' %}selected{% endif %}>Moderate</option>
        <option value="Hard" {% if trek[2]=='Hard' %}selected{% endif %}>Hard</option>
    </Select>
    
    <label for="Location">Location</label><small class="form-text text-muted"> (Length should be 3-100)</small><br>
    <input class="form-control" type="text" name="Location" id="Location" value="{{trek[3]}}" required minlength="3" maxlength="100">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Location / Region</label>
                        <input type="text" name="Location" class="form-control" value="{{ trek.Location }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Duration (Hours)</label>
                        <input type="number" name="Duration" class="form-control" value="{{ trek.Duration_HRS }}" min="1" required>
                    </div>
                </div>

    <label for="Duration">Duration</label><small class="form-text text-muted"> (in hours)</small><br>
    <input class="form-control" type="number" name="Duration" id="Duration" value="{{trek[4]}}" required min="1">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Start Date</label>
                        <input type="date" name="sDate" class="form-control" value="{{ trek.StartDate }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">End Date</label>
                        <input type="date" name="eDate" class="form-control" value="{{ trek.EndDate }}" required>
                    </div>
                </div>

    <label for="Start">Start Date</label>
    <input class="form-control" type="date" name="sDate" id="Start" value="{{trek[5]}}" required>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Capacity (Slots)</label>
                        <input type="number" name="Slot" class="form-control" value="{{ trek.Slot }}" min="{{ trek.Participants }}" required>
                        <small class="text-muted">Current bookings: {{ trek.Participants }}</small>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Price per Person (₹ INR)</label>
                        <input type="number" name="Price" class="form-control" value="{{ trek.Price }}" min="100" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Trek Status</label>
                        <select name="Status" class="form-select" required>
                            <option value="Open" {% if trek.Status=='Open' %}selected{% endif %}>Open</option>
                            <option value="Ongoing" {% if trek.Status=='Ongoing' %}selected{% endif %}>Ongoing</option>
                            <option value="Completed" {% if trek.Status=='Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

    <label for="End">End Date</label><small class="form-text text-muted"> (Should be after start date)</small><br>
    <input class="form-control" type="date" name="eDate" id="End" value="{{trek[6]}}" required>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Assigned Staff Guide</label>
                    <select name="StaffId" class="form-select">
                        <option value="">-- Unassigned --</option>
                        {% for s in staffs %}
                        <option value="{{ s.UserId }}" {% if staffId==s.UserId %}selected{% endif %}>{{ s.FullName }}</option>
                        {% endfor %}
                    </select>
                </div>

    <label for="Slot">Slots</label>
    <input class="form-control" type="number" name="Slot" id="Slot" value="{{trek[7]}}" required min="1">

    <label for="Price">Price</label><small class="form-text text-muted"> (in INR)</small><br>
    <input class="form-control" type="number" name="Price" id="Price" value="{{trek[10]}}" required min="1" step="0.01">

    <label for="Staff">Staff ID</label>
    <select class="form-control" name="StaffId" id="Staff">
        {% if trek[8] %}
        <option value="">Id, Name (Currently unassigned)</option>
        {% for staff in staffs %}
        <option value="{{staff[0]}}" {% if trek[8]==staffId %}selected{% endif %}>{{staff[0]}}, {{staff[1]}}</option>
        {% endfor %}
        {% else %}
        <option value="" selected>Id, Name (Currently unassigned)</option>
        {% for staff in staffs %}
        <option value="{{staff[0]}}">{{staff[0]}}, {{staff[1]}}</option>
        {% endfor %}
        {% endif %}
    </select>
    <label for="Staff">Status</label>
    <select  class="form-control"  name="Status" id="Status">
        <option value="Open" {% if trek[9] == "Open" %}selected{% endif %}>Open</option>
        <option value="Closed" {% if trek[9] == "Closed" %}selected{% endif %}>Closed</option>
        <option value="Ongoing" {% if trek[9] == "Ongoing" %}selected{% endif %}>Ongoing</option>
    </select>
    <br>
    <a class="btn btn-secondary" href="/adminTreks">Cancel</a>
    <button class="btn btn-primary" type="submit">Submit</button>
</form>
                <div class="d-flex justify-content-between pt-3 border-top">
                    <a href="{{ url_for('adminTreks') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-5 fw-bold">Update Trek</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
