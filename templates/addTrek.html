{% extends "adminLayout.html" %}
{% block title %}Add New Trek - TrekTerrain{% endblock %}

{% block content %}
<br><br>
<div id="form" class="d-flex flex-column justify-content-center align-items-center vh-80" >
<form action="/addTrek" method="POST" style="width:400px">
    <label for="TrekName">Trek Name</label><small class="form-text text-muted"> (Length should be 3-100)</small><br>
    <input class="form-control" type="text" name="Trekname" id="TrekName" required minlength="3" maxlength="100">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold mb-3 text-success"><i class="bi bi-plus-circle me-2"></i> Create New Mountain Trek</h4>
            <form action="{{ url_for('addTrek') }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Trek Name</label>
                        <input type="text" name="Trekname" class="form-control" placeholder="e.g. Kedarkantha Trek" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Difficulty Level</label>
                        <select name="Difficulty" class="form-select" required>
                            <option value="Easy">Easy</option>
                            <option value="Moderate" selected>Moderate</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>

    <label for="Difficulty">Difficulty</label>
    <Select class="form-control" id="Difficulty" name="Difficulty">
        <option value="" disabled selected>Select level</option>
        <option value="Easy">Easy</option>
        <option value="Moderate">Moderate</option>
        <option value="Hard">Hard</option>
    </Select>
    
    <label for="Location">Location</label><small class="form-text text-muted"> (Length should be 3-100)</small><br>
    <input class="form-control" type="text" name="Location" id="Location" required minlength="3" maxlength="100">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Location / Region</label>
                        <input type="text" name="Location" class="form-control" placeholder="e.g. Manali, Himachal Pradesh" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Duration (in Hours)</label>
                        <input type="number" name="Duration" class="form-control" placeholder="48" min="1" required>
                    </div>
                </div>

    <label for="Duration">Duration</label><small class="form-text text-muted"> (in hours)</small><br>
    <input class="form-control" type="number" name="Duration" id="Duration" required min="1">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Start Date</label>
                        <input type="date" name="sDate" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">End Date</label>
                        <input type="date" name="eDate" class="form-control" required>
                    </div>
                </div>

    <label for="Start">Start Date</label>
    <input class="form-control" type="date" name="sDate" id="Start" required>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Total Capacity (Slots)</label>
                        <input type="number" name="Slot" class="form-control" placeholder="20" min="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Price per Person (₹ INR)</label>
                        <input type="number" name="Price" class="form-control" value="1500" min="100" required>
                    </div>
                    <div class="col-md-4 mb-4">
                        <label class="form-label fw-semibold">Assign Staff Guide</label>
                        <select name="StaffId" class="form-select">
                            <option value="">-- Optional: Assign Later --</option>
                            {% for s in staffs %}
                            <option value="{{ s.UserId }}">{{ s.FullName }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

    <label for="End">End Date</label><small class="form-text text-muted"> (Should be after start date)</small><br>
    <input class="form-control" type="date" name="eDate" id="End" required>

    <label for="Slot">Slots</label>
    <input class="form-control" type="number" name="Slot" id="Slot" required min="1">

    <label for="Price">Price</label><small class="form-text text-muted"> (in INR)</small><br>
    <input class="form-control" type="number" name="Price" id="Price" required min="1" step="0.01">

    <label for="Staff">Staff ID</label>
    <select class="form-control" name="StaffId" id="Staff">
        <option value="" selected>Id, Name (Currently unassigned)</option>
        {% for staff in staffs %}
        <option value="{{staff[0]}}">{{staff[0]}}, {{staff[1]}}</option>
        {% endfor %}
    </select>
    <br>
    <a class="btn btn-secondary" href="/adminTreks">Cancel</a>
    <button class="btn btn-primary" type="submit">Submit</button>
</form>
                <div class="d-flex justify-content-between pt-3 border-top">
                    <a href="{{ url_for('adminTreks') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 fw-bold">Create Trek</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
