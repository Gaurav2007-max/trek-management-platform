{% extends "adminLayout.html" %}
{% block content %}
<form action="/addTrek" method="POST">
    <label for="TrekName">Trek Name</label>
    <input type="text" name="Trekname" id="TrekName">

    <label for="Difficulty">Difficulty</label>
    <Select id="Difficulty" name="Difficulty">
        <option value="Easy">Easy</option>
        <option value="Moderate">Moderate</option>
        <option value="Hard">Hard</option>
    </Select>        
    
    <label for="Location">Location</label>
    <input type="text" name="Location" id="Location">

    <label for="Duration">Duration(in hrs)</label>
    <input type="number" name="Duration" id="Duration">

    <label for="Start">Start Date</label>
    <input type="date" name="sDate" id="Start">

    <label for="End">End Date</label>
    <input type="date" name="eDate" id="End">

    <label for="Slot">Slots</label>
    <input type="number" name="Slot" id="Slot">

    <label for="Staff">Staff ID</label>
    <input type="number" name="StaffId" id="Staff">
    
    <a href="/adminTreks">Cancel</a>

    <input type="submit" value="Save">
</form>
{% endblock %}
