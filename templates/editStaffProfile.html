{% extends "staffLayout.html" %}
{% block title %}Edit Staff Profile - TrekTerrain{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold mb-3 text-primary"><i class="bi bi-pencil me-2"></i> Edit Staff Profile</h4>
            <form action="{{ url_for('editStaffProfile') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ Staff.FullName }}" required>
                </div>

<div id="form" class="d-flex flex-column justify-content-center align-items-center vh-80" style="margin-top:5%">
<form action="/editStaffProfile" method="POST" style="width:400px">
    <label for="name">Name:</label>
    <input class="form-control" type="text" name="name" id="name" value="{{Staff[1]}}" required minlength="3" maxlength="50" pattern="[A-Za-z ]+">
    <Small class="form-text text-muted"> (Only alphabets length 3-50) </Small><br>
    <br>
    <label for="email">Email:</label>
    <input class="form-control" type="email" name="email" id="email" value="{{Staff[2]}}" required>
    <br>
    <label for="contact">Contact:</label>
    <input class="form-control" type="text" name="contact" id="contact" value="{{Staff[3]}}" required pattern="[0-9]{10}">
    <Small class="form-text text-muted"> (without any country code) </Small><br>
    <br>
    <a class="btn btn-secondary" href="/staffProfile">Cancel</a>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ Staff.UserEmail }}" required>
                </div>

    <button class="btn btn-primary" type="submit">Save</button>
</form>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contact Number</label>
                    <input type="tel" name="contact" class="form-control" value="{{ Staff.Contact or '' }}" required>
                </div>

                <div class="d-flex justify-content-between pt-3 border-top">
                    <a href="{{ url_for('staffProfile') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
