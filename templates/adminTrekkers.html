{% extends "adminLayout.html" %}
{% block content %}
<div class="my-2 mx-2">
<form class="d-flex justify-content-center align-items-center" role="search" action="/adminTrekkers" method="POST">
    <label for="parameter"></label>
    <input class="form-control me-2" type="Text" name="NameorId" id="parameter" placeholder="Enter UserId or name" aria-label="Search"/>
    <button class="btn btn-primary" type="submit">Search</button>
</form>
</div>
{% if users %}
    <div class="table-responsive " style="padding:10px">
    <table class="table table-striped table-hover" style="margin-top:10px; ">
        <thead class="table-primary">
            <tr>
                <th>S.No</th>
                <th>UserId</th>
                <th>Name</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{loop.index}}</td>
                <td>{{user[0]}}</td>
                <td>{{user[1]}}</td>
                <td>{{user[2]}}</td>
                <td>{{user[5]}}</td>
                <td><a class="btn btn-danger" href='/blacklist/{{user[0]}}'>BlackList</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
{% else %}
    <h5> No Registered Trekkers</h5>
{% endif %}
{% endblock %}
